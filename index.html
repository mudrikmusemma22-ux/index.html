<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WLAN Zugang</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #10151c;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(70, 130, 255, 0.08), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(120, 90, 255, 0.08), transparent 40%);
    font-family: 'Space Grotesk', sans-serif;
    color: #e8ecf2;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #161d27;
    border: 1px solid #262f3b;
    border-radius: 20px;
    padding: 40px 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .signal {
    width: 44px;
    height: 44px;
    margin-bottom: 24px;
  }

  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: #6c8bff;
    margin-bottom: 8px;
  }

  h1 {
    font-size: 28px;
    font-weight: 700;
    margin-bottom: 32px;
    letter-spacing: -0.02em;
  }

  .field {
    margin-bottom: 20px;
  }

  .label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: #7c8aa0;
    margin-bottom: 6px;
  }

  .value-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: #0d1218;
    border: 1px solid #262f3b;
    border-radius: 12px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .value-row:active {
    background: #0a0d12;
  }

  .value-row.copied {
    border-color: #6c8bff;
  }

  .value {
    font-family: 'JetBrains Mono', monospace;
    font-size: 17px;
    font-weight: 500;
    word-break: break-all;
    letter-spacing: 0.01em;
  }

  .copy-hint {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: #55617a;
    flex-shrink: 0;
    margin-left: 12px;
    letter-spacing: 0.05em;
  }

  .value-row.copied .copy-hint {
    color: #6c8bff;
  }

  .footer-note {
    margin-top: 28px;
    font-size: 13px;
    color: #55617a;
    line-height: 1.5;
  }

  @media (prefers-reduced-motion: no-preference) {
    .card { animation: rise 0.5s ease-out; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  }
</style>
</head>
<body>

<div class="card">
  <svg class="signal" viewBox="0 0 24 24" fill="none" stroke="#6c8bff" stroke-width="2" stroke-linecap="round">
    <path d="M5 12.5a10 10 0 0 1 14 0"/>
    <path d="M8.2 15.7a5.5 5.5 0 0 1 7.6 0"/>
    <circle cx="12" cy="19" r="1.4" fill="#6c8bff" stroke="none"/>
  </svg>

  <div class="eyebrow">FRITZ!Box · Gästezugang</div>
  <h1>Willkommen im WLAN</h1>

  <div class="field">
    <div class="label">Netzwerkname</div>
    <div class="value-row" onclick="copyText('FRITZ!Box Gastzugang', this)">
      <span class="value">FRITZ!Box Gastzugang</span>
      <span class="copy-hint">Tippen</span>
    </div>
  </div>

  <div class="field">
    <div class="label">Passwort</div>
    <div class="value-row" onclick="copyText('03098144060507029799', this)">
      <span class="value">03098144060507029799</span>
      <span class="copy-hint">Tippen</span>
    </div>
  </div>

  <div class="footer-note">
    Feld antippen kopiert den Wert. Danach in den WLAN-Einstellungen einfügen und verbinden.
  </div>
</div>

<script>
function copyText(text, el) {
  navigator.clipboard.writeText(text).then(() => {
    el.classList.add('copied');
    const hint = el.querySelector('.copy-hint');
    const original = hint.textContent;
    hint.textContent = 'Kopiert';
    setTimeout(() => {
      el.classList.remove('copied');
      hint.textContent = original;
    }, 1500);
  });
}
</script>

</body>
</html>
